name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Capacitor dependencies
        run: npm install

      - name: Prepare fallback webDir
        run: |
          mkdir -p www
          cp index.html www/
          [ -f icon.ico ] && cp icon.ico www/ || true
          [ -f photo.jpg ] && cp photo.jpg www/ || true
          [ -f photo.png ] && cp photo.png www/ || true

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android icons from photo.jpg
        run: |
          pip install Pillow
          python - <<'EOF'
          from pathlib import Path
          from PIL import Image, ImageOps

          for candidate in ("photo.jpg", "photo.png", "icon.ico"):
              src_path = Path(candidate)
              if src_path.exists():
                  break
          else:
              raise FileNotFoundError("No icon image (photo.jpg, photo.png, or icon.ico) found in repository root")

          res_dir = Path("android/app/src/main/res")

          with Image.open(src_path) as im:
              im = ImageOps.exif_transpose(im)
              if src_path.suffix.lower() == ".ico":
                  sizes = im.info.get("sizes") or []
                  best = None
                  for w, h in sizes:
                      try:
                          im.size = (w, h)
                          im.load()
                          if best is None or w > best.width:
                              best = im.copy()
                      except Exception:
                          continue
                  base = (best or im).convert("RGBA")
              else:
                  base = im.convert("RGBA")

          dim = max(base.width, base.height)
          bg_color = (12, 14, 18, 255)  # #0c0e12

          # Legacy full-bleed square & round launcher icon
          full = Image.new("RGBA", (dim, dim), bg_color)
          full.paste(base, ((dim - base.width) // 2, (dim - base.height) // 2), base)

          # Adaptive icon foreground (64% safe-zone scale on transparent canvas)
          fg_canvas = Image.new("RGBA", (dim, dim), (0, 0, 0, 0))
          safe_size = int(dim * 0.64)
          scaled_fg = base.resize((safe_size, safe_size), Image.Resampling.LANCZOS)
          fg_canvas.paste(scaled_fg, ((dim - safe_size) // 2, (dim - safe_size) // 2), scaled_fg)

          mipmaps = {
              "mipmap-mdpi": (48, 108),
              "mipmap-hdpi": (72, 162),
              "mipmap-xhdpi": (96, 216),
              "mipmap-xxhdpi": (144, 324),
              "mipmap-xxxhdpi": (192, 432),
          }
          for folder, (legacy_px, adaptive_px) in mipmaps.items():
              out_dir = res_dir / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              full.resize((legacy_px, legacy_px), Image.Resampling.LANCZOS).save(out_dir / "ic_launcher.png")
              full.resize((legacy_px, legacy_px), Image.Resampling.LANCZOS).save(out_dir / "ic_launcher_round.png")
              fg_canvas.resize((adaptive_px, adaptive_px), Image.Resampling.LANCZOS).save(out_dir / "ic_launcher_foreground.png")
          EOF

      - name: Create colors.xml for adaptive background
        run: |
          mkdir -p android/app/src/main/res/values
          cat <<'EOF' > android/app/src/main/res/values/colors.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0c0e12</color>
          </resources>
          EOF

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: koblenz-campus-events-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error